server:
  port: 10010
  shutdown: graceful

spring:
  application:
    name: xline
  flyway:
    # 迁移由 xline 在节点初始化时按 flyway 开关执行；
    # 关闭全局 Flyway：它会在节点就绪前从路由数据源取连接（jdk8 分支会启动失败）
    enabled: false

logging:
  config: classpath:logback-xline.xml

forest:
  async-mode: platform
  max-connections: 1000
  max-route-connections: 500
  max-request-queue-size: 200
  max-async-thread-size: 300
  max-async-queue-size: 200
  connect-timeout: 3000
  read-timeout: 5000
  max-retry-count: 0
  ssl-protocol: TLS
  log-enabled: true
  log-request: true
  log-response-content: true
  log-response-status: true
  log-request-headers: false
  log-response-headers: false

# 本文件只放框架级配置，不含任何节点：
# 节点与 struct 是测试配置，统一放在工程根目录的 demo/ 下，
# 启动时用 --spring.config.additional-location 叠加（附加位置优先级更高，会整段覆盖 xline.nodes）。
#   java -jar target/xline.jar --spring.config.additional-location=file:./demo/tcp-test.yml
# 不叠加时 xline.nodes 为空，不初始化任何节点。
xline:
  nodes: []
  struct: {}

