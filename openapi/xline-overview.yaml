openapi: 3.0.3
info:
  title: xline Overview API
  version: 1.0.0
  description: Read-only runtime overview used by the Thymeleaf dashboard.
servers:
  - url: http://localhost:10010
paths:
  /api/xline/overview:
    get:
      summary: Get node configuration and data-flow topology
      operationId: getXlineOverview
      responses:
        '200':
          description: Current configured nodes and struct edges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
              example:
                nodes:
                  - name: node1
                    type: tcp
                    status: READY
                    properties:
                      tcp:
                        mode: SERVER
                        host: null
                        port: 9847
                        charset: UTF-8
                        password: '******'
                edges:
                  - source: node1
                    target: node2
components:
  schemas:
    Overview:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeOverview'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'
    NodeOverview:
      type: object
      required: [name, status, properties]
      properties:
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          description: NodeType segment, for example tcp or mysql.
        status:
          type: string
          enum: [READY, PENDING]
        properties:
          type: object
          additionalProperties: true
          description: Configuration sections. Password, secret, and token fields are always masked.
    TopologyEdge:
      type: object
      required: [source, target]
      properties:
        source:
          type: string
        target:
          type: string
