$kind: http-request
name: Get xline overview
method: GET
url: '{{base_url}}/api/xline/overview'
order: 1000
headers:
  - key: Accept
    value: application/json
    description: Request the dashboard response format.
examples: './.resources/get overview.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('returns node and edge arrays', function () {
        var body = pm.response.json();
        pm.expect(body.nodes).to.be.an('array');
        pm.expect(body.edges).to.be.an('array');
      });
      pm.test('nodes expose the documented fields', function () {
        pm.response.json().nodes.forEach(function (node) {
          pm.expect(node).to.have.property('name');
          pm.expect(node).to.have.property('type');
          pm.expect(node).to.have.property('status');
          pm.expect(node).to.have.property('properties');
          pm.expect(['READY', 'PENDING']).to.include(node.status);
        });
      });
      pm.test('edges expose source and target', function () {
        pm.response.json().edges.forEach(function (edge) {
          pm.expect(edge).to.have.all.keys('source', 'target');
        });
      });
      pm.test('sensitive values are masked', function () {
        var serialized = JSON.stringify(pm.response.json()).toLowerCase();
        pm.expect(serialized).to.not.include('top-secret');
        pm.expect(serialized).to.not.include('plain-password');
      });
